<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conrad Design Studio - Client 3D Render Portal</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --accent-color: #00adb5;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
            max-width: 600px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,173,181,0.2);
        }
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #2a2a2a;
        }
        .card-content {
            padding: 20px;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 0 0 8px 0;
        }
        .card-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }
        .card-link {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Interactive Spatial Tours</h1>
        <p>Select a project below to launch the immersive 3D virtual walkthrough platform.</p>
    </header>

    <div class="grid">
        
        <!-- Project 1 Card -->
        <a href="test1/" class="card">
            <!-- Tip: You can point this to the thumbnail inside your D5 export path -->
            <img src="test1/PanoThumbnail/83a3405b2273478cab986e91c593ae43.png" alt="Modern Villa Thumbnail" class="card-img">
            <div class="card-content">
                <h2 class="card-title">MIXFEST</h2>
                <p class="card-desc">Event Render, SMX</p>
                <span class="card-link">Launch Tour &rarr;</span>
            </div>
        </a>

        <!-- Project 2 Card -->
        <a href="test2/" class="card">
            <img src="test2/PanoThumbnail/83a3405b2273478cab986e91c593ae43.png" alt="Luxury Penthouse Thumbnail" class="card-img">
            <div class="card-content">
                <h2 class="card-title">Test 2</h2>
                <p class="card-desc">Interactive spatial walkthrough Test 2.</p>
                <span class="card-link">Launch Tour &rarr;</span>
            </div>
        </a>

    </div>

</body>
</html>
